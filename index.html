<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$ Xryn</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        cursor: url('https://r2.guns.lol/201adb0d-9de5-49b8-b9f5-3d192f56d9a5.png'), auto;
    }

    body, html {
        height: 100%;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: white;
        opacity: 0;
        animation: fadeIn 0.8s ease-out forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    /* Background Video */
    #bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
    }

    /* Wrapper */
    .wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(420px, 90vw);
    }

    /* Glass Card */
    .card {
        background: rgba(10, 10, 10, 0.55);
        border-radius: 22px;
        padding: 26px 22px;
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        text-align: center;
    }

    /* Profile Image */
    .pfp-wrapper {
        display: flex;
        justify-content: center;
        margin-bottom: 14px;
    }

    .pfp-ring {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        padding: 3px;
        background: radial-gradient(circle at 30% 0%, #ffffff, transparent 60%),
                    radial-gradient(circle at 80% 120%, #ff00ff, #00ffff);
        box-shadow: 0 0 18px rgba(0, 0, 0, 0.7);
    }

    .pfp {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
    }

    /* Name */
    .name {
        font-size: 26px;
        font-weight: 700;
        margin-top: 6px;
        margin-bottom: 4px;
    }

    .typing {
        display: inline-block;
        white-space: nowrap;
        overflow: hidden;
        border-right: 2px solid rgba(255, 255, 255, 0.8);
        animation: typing 2.4s steps(10) forwards, blink 0.7s infinite;
    }

    @keyframes typing {
        from { width: 0; }
        to { width: 7ch; }
    }

    @keyframes blink {
        50% { border-color: transparent; }
    }

    .subtitle {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 16px;
    }

    /* Social Buttons */
    .links {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
    }

    .link-btn {
        width: 100%;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: white;
        text-decoration: none;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: 0.12s ease-out;
        backdrop-filter: blur(10px);
    }

    .link-btn:hover {
        transform: translateY(-1px) scale(1.01);
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.35);
    }

    .link-btn img {
        width: 18px;
        height: 18px;
    }

    /* Audio Icon */
    #audioIcon {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 34px;
        height: 34px;
        cursor: pointer;
        filter: drop-shadow(0 0 5px black);
        transition: 0.15s ease-out;
    }

    #audioIcon.playing {
        animation: pulse 1.4s infinite;
        filter: drop-shadow(0 0 10px rgba(0, 255, 200, 0.9));
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.08); }
        100% { transform: scale(1); }
    }

    .footer {
        margin-top: 12px;
        font-size: 11px;
        opacity: 0.6;
    }
</style>
</head>

<body>

<!-- Background Video -->
<video id="bg-video" autoplay loop muted playsinline>
    <source src="https://r2.guns.lol/bdd28ceb-147d-4647-afce-244dc6eaee8c.mp4" type="video/mp4">
</video>

<!-- Audio -->
<audio id="bg-audio" loop>
    <source src="Sayonara Cross Teck (Slowed).mp3" type="audio/mpeg">
</audio>

<!-- Audio Icon -->
<img id="audioIcon" src="https://cdn-icons-png.flaticon.com/512/727/727240.png">

<!-- Main Card -->
<div class="wrapper">
    <div class="card">

        <div class="pfp-wrapper">
            <div class="pfp-ring">
                <img class="pfp" src="https://cdn.discordapp.com/avatars/1495216497537056890/4cbc873fc673898757f6ff2bbaf2a627.png" alt="profile">
            </div>
        </div>

        <div class="name">
            <span class="typing">$ Xryn</span>
        </div>

        <div class="subtitle">just vibing on the internet.</div>

        <div class="links">

            <a class="link-btn" href="https://discord.com/users/1495216497537056890" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png">
                Discord
            </a>

            <a class="link-btn" href="https://github.com/vladimiryaroslav" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/733/733553.png">
                GitHub
            </a>

        </div>

        <div class="footer">made with a little chaos.</div>

    </div>
</div>

<script>
    const audio = document.getElementById("bg-audio");
    const audioIcon = document.getElementById("audioIcon");

    audio.volume = 0.5;
    let started = false;

    // Start audio on first click
    document.addEventListener("click", () => {
        if (!started) {
            audio.play().catch(() => {});
            started = true;
            audioIcon.classList.add("playing");
        }
    });

    // Icon toggles play/pause
    audioIcon.addEventListener("click", (e) => {
        e.stopPropagation();
        if (audio.paused) {
            audio.play().catch(() => {});
            audioIcon.src = "https://cdn-icons-png.flaticon.com/512/727/727240.png";
            audioIcon.classList.add("playing");
        } else {
            audio.pause();
            audioIcon.src = "https://cdn-icons-png.flaticon.com/512/727/727269.png";
            audioIcon.classList.remove("playing");
        }
    });

    // Tab title typing
    const titleText = "$ Xryn";
    let index = 0;
    let deleting = false;

    function animateTitle() {
        if (!deleting) {
            document.title = titleText.substring(0, index++);
            if (index > titleText.length) {
                deleting = true;
                setTimeout(animateTitle, 900);
                return;
            }
        } else {
            document.title = titleText.substring(0, index--);
            if (index < 0) {
                deleting = false;
                index = 0;
            }
        }
        setTimeout(animateTitle, deleting ? 130 : 180);
    }

    animateTitle();
</script>

</body>
</html>
