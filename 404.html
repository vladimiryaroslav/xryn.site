<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Not Found</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        cursor: url('https://r2.guns.lol/201adb0d-9de5-49b8-b9f5-3d192f56d9a5.png'), auto;
    }

    body, html {
        height: 100%;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: white;
        opacity: 0;
        animation: fadeIn 0.8s ease-out forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    /* Background Video */
    #bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
    }

    /* Center Wrapper */
    .wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(420px, 90vw);
    }

    /* Glass Card */
    .card {
        background: rgba(10, 10, 10, 0.55);
        border-radius: 22px;
        padding: 32px 26px;
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        text-align: center;
    }

    h1 {
        font-size: 48px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    p {
        font-size: 14px;
        opacity: 0.8;
        margin-bottom: 22px;
    }

    /* Buttons */
    .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 10px;
    }

    .link-btn {
        width: 100%;
        padding: 12px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
        color: white;
        text-decoration: none;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: 0.12s ease-out;
        backdrop-filter: blur(10px);
    }

    .link-btn:hover {
        transform: translateY(-1px) scale(1.01);
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.35);
    }

    .link-btn img {
        width: 18px;
        height: 18px;
    }

    .footer {
        margin-top: 18px;
        font-size: 11px;
        opacity: 0.6;
    }
</style>
</head>

<body>

<!-- Background Video -->
<video id="bg-video" autoplay loop muted playsinline>
    <source src="https://r2.guns.lol/bdd28ceb-147d-4647-afce-244dc6eaee8c.mp4" type="video/mp4">
</video>

<div class="wrapper">
    <div class="card">

        <h1>404</h1>
        <p>The page you're looking for doesn't exist.</p>

        <div class="links">

            <a class="link-btn" href="/">
                <img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png">
                Go Home
            </a>

            <a class="link-btn" onclick="copyDiscord()">
                <img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png">
                Copy Discord: xryn0855
            </a>

        </div>

        <div class="footer">lost in the void.</div>

    </div>
</div>

<script>
function copyDiscord() {
    navigator.clipboard.writeText("xryn4");
}
</script>

</body>
</html>
